plugins {
    id 'java'
    id 'idea'
    // Latest version: https://projects.neoforged.net/neoforged/ModDevGradle
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

// All versions and mod metadata live in gradle.properties.
version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.20.1, so the mod must target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    enable {
        // NeoForge for 1.20.1 is published as net.neoforged:forge:<minecraft version>-<neoforge version>
        neoForgeVersion = "${project.minecraft_version}-${project.neo_version}"
    }

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            // Comma-separated list of namespaces to load GameTests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // Starts a GameTest server, runs all registered GameTests and exits.
        // The server crashes if no GameTests are registered.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            // Every run gets its own game directory: run/client, run/server, ...
            gameDirectory = project.file("run/${it.name}")

            // Logging markers: "SCAN" (mod scanning), "REGISTRIES" (registry events), "REGISTRYDUMP" (registry contents)
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Include resources generated by the data generators.
sourceSets.main.resources.srcDir 'src/generated/resources'

// Dependencies in "localRuntime" are only added to the development runs and are never
// declared as dependencies of the mod. "modLocalRuntime" is its remapping counterpart.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

repositories {
    // Every repository is restricted to the groups it provides, so Gradle never queries it for anything else.
    flatDir {
        name = 'Local libraries'
        dirs 'lib'
        content { includeGroup 'de.joh' }
    }
    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
            includeGroup 'top.theillusivec4.caelus'
        }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

// The mod* configurations remap the SRG-named mod jars to the names used in development.
// They are not transitive: every required mod has to be declared explicitly.
dependencies {
    // Required mods
    modImplementation "curse.maven:mna-406360:${mna_version}"
    modImplementation "de.joh:tnl:${tnl_version}"
    modImplementation "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
    modImplementation "top.theillusivec4.caelus:caelus-forge:${caelus_version}"
    modCompileOnly "top.theillusivec4.curios:curios-forge:${curios_version}:api"
    modRuntimeOnly "top.theillusivec4.curios:curios-forge:${curios_version}"

    // Optional mods, development runs only
    modLocalRuntime "curse.maven:magichem-982204:${magichem_version}"
    modLocalRuntime "curse.maven:jei-238222:${jei_version}"
}

// Expands the properties below into the files in src/main/templates (mods.toml, pack.mcmeta).
// Referencing a property that is not listed here fails the build.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            pack_format_number     : pack_format_number,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_license            : mod_license,
            mod_description        : mod_description,
            mod_issue_tracker_url  : mod_issue_tracker_url,
            mod_display_url        : mod_display_url,
            mna_version_range      : mna_version_range,
            tnl_version_range      : tnl_version_range,
            curios_version_range   : curios_version_range,
            caelus_version_range   : caelus_version_range,
            geckolib_version_range : geckolib_version_range,
            magichem_version_range : magichem_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Adds the generated files to the main resources, for Gradle builds and IDE runs alike.
sourceSets.main.resources.srcDir generateModMetadata
// Regenerates the files on every IDE project sync.
legacyForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    manifest.attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : mod_authors,
    ])
}

// Byte-for-byte reproducible jars, which also keeps the Gradle build cache effective.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('wrapper', Wrapper) {
    distributionType = Wrapper.DistributionType.BIN
}

// IntelliJ IDEA no longer downloads sources and Javadoc of dependencies on its own.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
