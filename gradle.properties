# Single source of truth for all versions and mod metadata.
# The values below are used by build.gradle and expanded into the files in src/main/templates
# (META-INF/mods.toml, pack.mcmeta). Never hardcode them anywhere else.

## Gradle

# Memory for the Gradle daemon (remapping the mod dependencies needs some headroom).
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment

# Minecraft and NeoForge (the 1.20.1 NeoForge fork still uses the "forge" mod ID and 47.x versions).
# The NeoForge version must match the Minecraft version, see https://projects.neoforged.net/neoforged/forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
neo_version=47.1.65
neo_version_range=[47.1,)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[47,)

# Parchment mappings (parameter names and Javadoc on top of the official Mojang mappings).
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Resource and data pack format of pack.mcmeta (15 = Minecraft 1.20.1).
pack_format_number=15

## Mod properties

# Must match DragonMagicAndRelics.MOD_ID.
mod_id=dmnr
mod_name=Dragon Magic and Relics
# Mod version, see https://semver.org/
mod_version=3.2.14
# Maven group, matches the base package of the sources.
mod_group_id=de.joh.dmnr
mod_authors=Joh0210
# Must match LICENSE.md.
mod_license=MIT
mod_description=A mod to expand your magic to compete with gods!
mod_issue_tracker_url=https://github.com/Joh0210/DragonMagicAndRelics/issues
mod_display_url=https://www.curseforge.com/minecraft/mc-mods/dragon-magic-and-relics

## Dependencies
# *_version: the artifact used to compile and run in development.
# *_version_range: the range required at runtime, written into mods.toml.
# CurseMaven versions are CurseForge file IDs, see https://www.cursemaven.com/

# Mana and Artifice (required) - https://www.curseforge.com/minecraft/mc-mods/mana-and-artifice/files
mna_version=6847805
mna_version_range=[3.1.11,)

# Tomes And Libs (required) - local jar: lib/tnl-<tnl_version>.jar
tnl_version=1.0
tnl_version_range=[1.0,)

# Curios API (required) - https://github.com/TheIllusiveC4/Curios
curios_version=5.4.7+1.20.1
curios_version_range=[5.4.7,)

# Caelus API (required) - https://github.com/TheIllusiveC4/Caelus
caelus_version=3.1.0+1.20
caelus_version_range=[3.1.0,)

# GeckoLib (required) - https://github.com/bernie-g/geckolib
geckolib_version=4.2.2
geckolib_version_range=[4.2.2,)

# MagiChem (optional, only loaded in the development runs) - https://www.curseforge.com/minecraft/mc-mods/magichem/files
magichem_version=7190149
magichem_version_range=[0.5.1,)

# Applied Energistics 2 (optional, code integration in de.joh.dmnr.compat.ae2) - https://modmaven.dev/appeng/appliedenergistics2-forge/
# The integration builds on AE2 internals (appeng.menu, appeng.blockentity, ...), so the range is limited to the
# tested major version. Raise the upper bound only after testing against the next AE2 release.
ae2_version=15.4.11
ae2_version_range=[15.4.0,16.0.0)

# GuideME (required by AE2 since 15.4, development runs only) - https://repo1.maven.org/maven2/org/appliedenergistics/guideme/
guideme_version=20.1.15

# Just Enough Items (development runs only) - https://www.curseforge.com/minecraft/mc-mods/jei/files
jei_version=6075247
